name: Publish to pub.dev

# Tag-triggered automated publishing via pub.dev OIDC (no GPG keys to manage),
# replacing the Java project's Maven Central + GPG release flow.
# Requires each package to be registered as an automated-publishing source on
# pub.dev with this repository + tag pattern. Use per-package tags, e.g.
# `didwebvh_core-vX.Y.Z`.

on:
  push:
    tags:
      - 'didwebvh_core-v[0-9]+.[0-9]+.[0-9]+'
      - 'didwebvh_signing_local-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write # required for pub.dev OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Select package from tag
        id: pkg
        run: echo "dir=packages/${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dart pub publish --force
        working-directory: ${{ steps.pkg.outputs.dir }}
