name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Analog of the Java 11/17/21/25 matrix: declared minimum, stable, beta.
        sdk: [ '3.6.0', 'stable', 'beta' ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Dart ${{ matrix.sdk }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test with coverage
        run: dart test --coverage=coverage
        working-directory: packages/didwebvh_core

      - name: Format coverage to lcov
        if: matrix.sdk == 'stable'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --package=.
        working-directory: packages/didwebvh_core

      - name: Upload coverage to Codecov
        if: matrix.sdk == 'stable'
        uses: codecov/codecov-action@v5
        with:
          files: packages/didwebvh_core/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
