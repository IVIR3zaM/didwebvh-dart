name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Analog of the Java 11/17/21/25 matrix: declared minimum, stable, beta.
        sdk: [ '3.6.0', 'stable', 'beta' ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Dart ${{ matrix.sdk }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      # Single source of truth with the local gate: pub get + workspace analyze
      # + `dart test` for EVERY package with a test/ dir (core, signing_local,
      # and the wizard once it has tests). `--coverage` (stable leg only) also
      # writes packages/didwebvh_core/coverage/lcov.info; coverage stays scoped
      # to didwebvh_core per codecov.yml, but all package tests run on every leg.
      - name: Verify (analyze + all package tests + core coverage)
        run: bash tool/verify.sh ${{ matrix.sdk == 'stable' && '--coverage' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.sdk == 'stable'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/didwebvh_core/coverage/lcov.info
          fail_ci_if_error: false
