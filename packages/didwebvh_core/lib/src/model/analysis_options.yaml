# Inherit the package (→ workspace) rule set.
include: ../../../analysis_options.yaml

linter:
  rules:
    # This directory is the ported model DTO layer: faithful ports of Java's
    # Gson-populated, builder-mutated beans (LogEntry, Parameters,
    # DataIntegrityProof, ResolutionMetadata, ResolveResult, ...). They are
    # intentionally mutable yet need value equality for round-trip
    # (de)serialization tests and log-chain comparisons — these instances are
    # never used as Map/Set keys, so the lint's footgun does not apply. The
    # exemption is scoped to this directory only; the rest of the package keeps
    # the guard. Mirrors the per-class suppression in the Java reference's
    # config/spotbugs-exclude.xml.
    avoid_equals_and_hash_code_on_mutable_classes: false
