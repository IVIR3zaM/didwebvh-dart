name: didwebvh_wizard
description: >-
  Interactive CLI wizard for did:webvh (create / update / resolve / export
  did:web). A faithful Dart port of didwebvh-java's didwebvh-wizard module.
  Thin adapter — not published, excluded from the coverage gate.
version: 0.1.0
repository: https://github.com/IVIR3zaM/didwebvh-dart
publish_to: none

environment:
  sdk: '^3.6.0'

resolution: workspace

dependencies:
  args: ^2.5.0
  didwebvh_core:
    path: ../didwebvh_core
  didwebvh_signing_local:
    path: ../didwebvh_signing_local

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.2.0
