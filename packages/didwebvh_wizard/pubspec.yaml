name: didwebvh_wizard
description: >-
  Interactive CLI wizard for did:webvh (create / update / resolve / export
  did:web). A faithful Dart port of didwebvh-java's didwebvh-wizard module.
version: 0.1.0-rc1
repository: https://github.com/IVIR3zaM/didwebvh-dart
issue_tracker: https://github.com/IVIR3zaM/didwebvh-dart/issues
topics:
  - did
  - didwebvh
  - ssi
  - identity
  - cryptography

executables:
  didwebvh_wizard:

environment:
  sdk: '^3.6.0'

resolution: workspace

dependencies:
  args: ^2.5.0
  didwebvh_core: ^0.1.0-rc1
  didwebvh_signing_local: ^0.1.0-rc1
  path: ^1.9.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^7.0.0
